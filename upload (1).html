<!-- Simplified Face Recognition App UI -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face Recognition App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { font-family: system-ui, sans-serif; }
    </style>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-green-100 to-blue-100 flex flex-col items-center justify-center p-6">
    <!-- Header -->
    <header class="mb-6 text-center">
      <h1 class="text-3xl font-extrabold text-green-700">🌿 Face Recognition App</h1>
      <p class="text-sm text-green-600">Upload an image and detect faces instantly</p>
    </header>

    <!-- Upload Section -->
    <section class="w-full max-w-md bg-white rounded-2xl shadow-lg border p-6 text-center">
      <h2 class="text-lg font-semibold mb-4 text-green-700">📤 Upload Image</h2>
      <form id="upload-form" enctype="multipart/form-data">
        <input id="file-input" type="file" accept="image/*" class="block w-full text-sm mb-4 border rounded px-2 py-1" />
        <button id="btn-submit-upload" type="button" class="w-full px-4 py-2 rounded-xl bg-green-600 hover:bg-green-700 transition text-white text-sm font-medium disabled:opacity-50">Run Recognition</button>
      </form>
      <div class="mt-4">
        <img id="preview" class="hidden w-40 h-40 object-cover rounded-lg border-2 border-green-200 mx-auto shadow" alt="preview" />
      </div>
    </section>

    <!-- Result Section -->
    <section class="w-full max-w-md bg-white rounded-2xl shadow-lg border p-6 text-center mt-6">
      <h2 class="text-lg font-semibold mb-2 text-green-700">📊 Result</h2>
      <div id="result-box" class="mt-4 aspect-video bg-green-50 rounded-xl grid place-items-center overflow-hidden border">
        <div id="placeholder" class="text-green-400 text-sm">No output yet</div>
        <img id="result-image" class="hidden w-full h-full object-contain" alt="recognition result" />
      </div>
      <div id="status" class="mt-3 text-xs text-green-500"></div>
    </section>

    <!-- Footer -->
    <footer class="mt-10 text-xs text-green-700">
      <p>© 2024 WorldQuant University — CC BY‑NC‑ND 4.0</p>
    </footer>

    <script>
      const fileInput = document.getElementById('file-input');
      const preview = document.getElementById('preview');
      const btnSubmitUpload = document.getElementById('btn-submit-upload');

      const setStatus = (msg) => document.getElementById('status').textContent = msg || '';

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file || !file.type.startsWith('image/')) return;
        const url = URL.createObjectURL(file);
        preview.src = url;
        preview.classList.remove('hidden');
        btnSubmitUpload.disabled = false;
        fileInput.fileForUpload = file;
      });

      btnSubmitUpload.addEventListener('click', async () => {
        try {
          if (!fileInput.fileForUpload) return;
          setStatus('⏳ Uploading image…');
          const fd = new FormData();
          fd.append('image', fileInput.fileForUpload, fileInput.fileForUpload.name || 'upload.jpg');
          await sendToRecognize(fd);
        } catch (err) {
          console.error(err);
          setStatus('❌ Error while processing');
        }
      });

      async function sendToRecognize(formData) {
        const resultImg = document.getElementById('result-image');
        const placeholder = document.getElementById('placeholder');
        resultImg.classList.add('hidden');
        placeholder.classList.remove('hidden');

        const res = await fetch('/recognize', { method: 'POST', body: formData });
        const contentType = res.headers.get('Content-Type') || '';

        if (!res.ok) {
          const msg = await res.text();
          setStatus(`⚠️ ${msg || 'Server error'}`);
          return;
        }

        if (contentType.includes('image/')) {
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          resultImg.src = url;
          resultImg.classList.remove('hidden');
          placeholder.classList.add('hidden');
          setStatus('✅ Done.');
        } else {
          const msg = await res.text();
          setStatus(`⚠️ ${msg || 'Unexpected response'}`);
        }
      }
    </script>
  </body>
</html>
